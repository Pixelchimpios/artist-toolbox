<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Legal Info – Artist Toolbox</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f8a502;
      font-family: 'Segoe UI', sans-serif;
      color: black;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding-top: 250px; /* Moves content up */
    }

    h1 {
      font-size: 3em;
      font-weight: bold;
      text-shadow: 2px 2px #a14000;
      margin-bottom: 40px;
    }

    .button-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .button {
      background-color: #e97131;
      border: 2px solid #a14000;
      color: white;
      text-decoration: none;
      padding: 4px 0; /* 4px vertical padding */
      border-radius: 8px;
      font-size: 1.3em;
      width: 300px;
      text-align: center;
      line-height: 1.4em;
    }

    .button:hover {
      background-color: #cc5c1f;
    }
  </style>
</head>
<body>

  <h1>Legal Info</h1>

  <div class="button-container">
    <a href="ArtistToolbox_PrivacyPolicy.pdf" class="button" target="_blank">Privacy Policy</a>
    <a href="Apple_EULA.pdf" class="button" target="_blank">Apple Standard EULA</a>
  </div>

</body>
</html>
