<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ARTTREZZI – The Artist Toolbox</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f8a502;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .top-banner {
      background-color: #fff3cd;
      color: #856404;
      border: 2px solid #ffeeba;
      border-radius: 10px;
      padding: 6px 16px;
      margin-top: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      max-width: 400px;
    }

    .top-banner img {
      height: 32px;
    }

    .top-banner p {
      font-size: 0.95em;
      font-weight: bold;
      margin: 0;
    }

    .container {
      transform: scale(1.45);
      transform-origin: top center;
      max-width: 500px;
      padding: 10px 20px 40px 20px;
      margin-top: 20px;
    }

    .header-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      margin-left: 140px;
    }

    .logo {
      width: 60px;
    }

    .tagline {
      font-style: italic;
      color: #333333;
      font-size: 1.2em;
      margin-top: 4px;
    }

    .image-wrapper {
      position: relative;
      width: 235px;
      margin: 10px auto 20px auto;
      left: 50px;
    }

    .toolbox-img {
      width: 100%;
      border-radius: 10px;
      display: block;
      margin-left: 17px;
    }

    .title-overlay {
      position: absolute;
      bottom: 0;
      right: -18px;
      font-size: 4.2em;
      font-weight: 900;
      color: white;
      text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.6);
      line-height: 0.85;
      text-align: right;
      z-index: 2;
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: -5px;
      margin-bottom: 12px;
      flex-wrap: nowrap;
    }

    .button-link {
      background-color: #e97131;
      border: 2px solid #a14000;
      color: white;
      width: 100px;
      height: 18px;
      border-radius: 8px;
      font-size: 0.65em;
      font-weight: 500;
      cursor: pointer;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .button-link:hover {
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.45);
      transform: translateY(-1.5px) scale(1.03);
    }

    footer {
      text-align: center;
      font-size: 0.75em;
      color: #ffffffcc;
      margin-top: 18px;
    }

    footer::before {
      content: '';
      display: block;
      width: 80%;
      height: 1px;
      background-color: #ffffff55;
      margin: 10px auto 14px auto;
    }

    .contact {
      display: block;
      margin-top: 4px;
      font-style: italic;
      color: black;
      font-weight: bold;
      text-decoration: underline;
      text-align: center;
      width: 90px;
      margin-left: 15px;
    }
  </style>
</head>
<body>

<!-- 🔝 Top Banner (upper-right, same style) -->
<a href="https://apps.apple.com/app/arttrezzi-artist-toolbox/id6748783513"
   target="_blank"
   rel="noopener noreferrer"
   style="position: absolute; top: 18px; right: 18px;">
  <div class="top-banner">
    <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg"
         alt="App Store badge">
  </div>
</a>



  <div class="container">

    <!-- ✅ Logo + Tagline -->
    <div class="header-wrapper">
      <div class="header-row">
        <img src="PixelchimpIOS LOGO.jpg" alt="Logo" class="logo">
        <div class="tagline">“The Artist Toolbox”</div>
      </div>
    </div>

    <!-- Toolbox Image + Overlay -->
    <div class="image-wrapper">
      <img src="APP ICON.png" alt="Toolbox Icon" class="toolbox-img">
      <div class="title-overlay">ARTTREZZI</div>
    </div>

    <!-- Buttons -->
    <div class="button-row">
<a href="https://apps.apple.com/app/arttrezzi-artist-toolbox/id6748783513"
      <span class="button-link" onclick="window.open("https://apps.apple.com/app/arttrezzi-artist-toolbox/id6748783513", '_blank')">App Store</span>

</a>
      <span class="button-link" onclick="window.location.href='Legal.html'">Legal Info</span>
      <span class="button-link" onclick="window.location.href='AppImages.html'">App Images</span>
      <span class="button-link" onclick="window.location.href='CONTACT.html'">Contact</span>
    </div>


    <!-- Copyright -->
    <footer>
      © 2025 Arttrezzi – All Rights Reserved.
    </footer>

  </div>
</body>
</html>
