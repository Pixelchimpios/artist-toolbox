<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ColorPicker Studio</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f8a502;
      font-family: 'Segoe UI', sans-serif;
      color: black;
      text-align: center;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .back-button {
      position: absolute;
      top: 18px;
      left: 18px;
      background-color: #e97131;
      border: 2px solid #a14000;
      color: white;
      font-size: 0.75em;
      text-decoration: none;
      padding: 4px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
      z-index: 999;
    }

    .back-button:hover {
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      transform: translateY(-1px) scale(1.02);
    }

    h1 {
      font-size: 3.2em;
      font-weight: bold;
      color: white;
      text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
      margin-top: 40px;
      margin-bottom: 20px;
    }

    .image-gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 0 20px 10px;
    }

    .image-gallery span {
      display: inline-block;
      cursor: pointer;
    }

    .image-gallery img {
      width: 225px;
      height: 300px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease-in-out;
    }

    .image-gallery img:hover {
      transform: scale(1.05);
    }

    footer {
      padding: 6px 0;
      font-size: 0.75em;
      color: #ffffffcc;
      text-align: center;
      margin-top: 10px;
    }

    footer::before {
      content: '';
      display: block;
      width: 80%;
      height: 1px;
      background-color: #ffffff55;
      margin: 6px auto;
    }

    footer span {
      color: #ffffffcc;
      text-decoration: none;
      margin: 0 10px;
      cursor: pointer;
    }

    footer span:hover {
      text-decoration: underline;
    }

    @media (max-width: 700px) {
      .image-gallery {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <!-- Back button -->
  <span class="back-button" onclick="window.location.href='../AppImages.html'">← Back to App Images</span>

  <!-- Title -->
  <h1>ColorPicker Studio</h1>

  <!-- Image Gallery -->
  <div class="image-gallery">
    <span onclick="window.open('1 Color Picker Studio Main Screen.png', '_blank')">
      <img src="1 Color Picker Studio Main Screen.png" alt="1 Color Picker Studio Main Screen">
    </span>
    <span onclick="window.open('2 Color Picker Studio.png', '_blank')">
      <img src="2 Color Picker Studio.png" alt="2 Color Picker Studio">
    </span>
    <span onclick="window.open('3 Color Picker Studio with image.png', '_blank')">
      <img src="3 Color Picker Studio with image.png" alt="3 Color Picker Studio with image">
    </span>
    <span onclick="window.open('3B Color Picker studio with image no color selected.png', '_blank')">
      <img src="3B Color Picker studio with image no color selected.png" alt="3B No color selected">
    </span>
    <span onclick="window.open('4 summary.png', '_blank')">
      <img src="4 summary.png" alt="4 summary">
    </span>
    <span onclick="window.open('5 Color Picker Paint Chip.png', '_blank')">
      <img src="5 Color Picker Paint Chip.png" alt="5 Color Picker Paint Chip">
    </span>
    <span onclick="window.open('6 Color Picker Paint Chip Black.png', '_blank')">
      <img src="6 Color Picker Paint Chip Black.png" alt="6 Black Paint Chip">
    </span>
    <span onclick="window.open('7 Color Picker Paint Chip Grey.png', '_blank')">
      <img src="7 Color Picker Paint Chip Grey.png" alt="7 Grey Paint Chip">
    </span>
    <span onclick="window.open('8 Color Picker Paint Chip compliment colors and tones.png', '_blank')">
      <img src="8 Color Picker Paint Chip compliment colors and tones.png" alt="8 Compliment Colors">
    </span>
    <span onclick="window.open('9 ColorPicker  Instructions 1.png', '_blank')">
      <img src="9 ColorPicker  Instructions 1.png" alt="9 Instructions">
    </span>
  </div>

  <!-- Footer -->
  <footer>
    © 2025 Arttrezzi – All Rights Reserved. |
    <span onclick="window.location.href='../AppImages.html'">App Images</span> |
    <span onclick="window.location.href='Legal.html'">Legal</span> |
    <span onclick="window.location.href='Contact.html'">Contact</span>
  </footer>

</body>
</html>
