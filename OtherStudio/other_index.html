<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Other Studio</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f8a502;
      font-family: 'Segoe UI', sans-serif;
      color: black;
      text-align: center;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .back-button {
      position: absolute;
      top: 18px;
      left: 18px;
      background-color: #e97131;
      border: 2px solid #a14000;
      color: white;
      font-size: 0.75em;
      padding: 4px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
      z-index: 999;
    }

    .back-button:hover {
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      transform: translateY(-1px) scale(1.02);
    }

    h1 {
      font-size: 3.2em;
      font-weight: bold;
      color: white;
      text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
      margin-top: 40px;
      margin-bottom: 20px;
    }

    .image-gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 0 20px 10px;
    }

    .image-gallery span img {
      width: 225px;
      height: 300px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease-in-out;
      cursor: pointer;
    }

    .image-gallery span img:hover {
      transform: scale(1.05);
    }

    footer {
      padding: 6px 0;
      font-size: 0.75em;
      color: #ffffffcc;
      text-align: center;
      margin-top: 10px;
    }

    footer::before {
      content: '';
      display: block;
      width: 80%;
      height: 1px;
      background-color: #ffffff55;
      margin: 6px auto;
    }

    footer span {
      color: #ffffffcc;
      text-decoration: none;
      margin: 0 10px;
      cursor: pointer;
    }

    footer span:hover {
      text-decoration: underline;
    }

    @media (max-width: 700px) {
      .image-gallery {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <!-- Back Button -->
  <span class="back-button" onclick="window.location.href='../AppImages.html'">← Back to App Images</span>

  <!-- Title -->
  <h1>Other Studio</h1>

  <!-- Image Gallery -->
  <div class="image-gallery">
    <span onclick="window.open('1 other .png', '_blank')">
      <img src="1 other .png" alt="1 other .png">
    </span>
    <span onclick="window.open('2 other my pallet .png', '_blank')">
      <img src="2 other my pallet .png" alt="2 other my pallet .png">
    </span>
    <span onclick="window.open('3 other color mixing.png', '_blank')">
      <img src="3 other color mixing.png" alt="3 other color mixing.png">
    </span>
    <span onclick="window.open('4 Color theory Squares.png', '_blank')">
      <img src="4 Color theory Squares.png" alt="4 Color theory Squares.png">
    </span>
    <span onclick="window.open('5 Color Theory Wheel.png', '_blank')">
      <img src="5 Color Theory Wheel.png" alt="5 Color Theory Wheel.png">
    </span>
    <span onclick="window.open('6 Image filters.png', '_blank')">
      <img src="6 Image filters.png" alt="6 Image filters.png">
    </span>
  </div>

  <!-- Footer -->
  <footer>
    © 2025 Arttrezzi – All Rights Reserved. |
    <span onclick="window.location.href='../AppImages.html'">App Images</span> |
    <span onclick="window.location.href='Legal.html'">Legal</span> |
    <span onclick="window.location.href='Contact.html'">Contact</span>
  </footer>

</body>
</html>
