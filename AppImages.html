<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>App Images – Artist Toolbox</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f8a502;
      font-family: 'Segoe UI', sans-serif;
      color: black;
      text-align: center;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .back-button {
      position: absolute;
      top: 18px;
      left: 18px;
      background-color: #e97131;
      border: 2px solid #a14000;
      color: white;
      font-size: 0.75em;
      padding: 4px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }

    .back-button:hover {
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      transform: translateY(-1px) scale(1.02);
    }

    h1 {
      font-size: 3.2em;
      font-weight: bold;
      color: white;
      text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
      margin-top: 80px;
      margin-bottom: 50px;
    }

    .gallery {
      display: flex;
      justify-content: center;
      gap: 50px;
      flex-wrap: wrap;
      margin-bottom: 80px;
      padding: 0 20px;
    }

    .gallery-item {
      max-width: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .gallery-item span img {
      width: 240px;
      height: 320px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.4);
      margin-bottom: 16px;
      transition: transform 0.2s ease-in-out;
      cursor: pointer;
    }

    .gallery-item span img:hover {
      transform: scale(1.05);
    }

    .button-link {
      background-color: #e97131;
      border: 2px solid #a14000;
      color: white;
      width: 260px;
      height: 30px;
      border-radius: 8px;
      font-size: 0.85em;
      font-weight: bold;
      cursor: pointer;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      margin-top: 8px;
    }

    .button-link:hover {
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.45);
      transform: translateY(-1.5px) scale(1.03);
    }

    footer {
      padding: 30px 0 20px 0;
      font-size: 0.75em;
      color: #ffffffcc;
      text-align: center;
    }

    footer::before {
      content: '';
      display: block;
      width: 80%;
      height: 1px;
      background-color: #ffffff55;
      margin: 20px auto 14px auto;
    }

    footer span {
      color: #ffffffcc;
      text-decoration: none;
      margin: 0 10px;
      cursor: pointer;
    }

    footer span:hover {
      text-decoration: underline;
    }

    @media (max-width: 700px) {
      .gallery {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <!-- Back button -->
  <span class="back-button" onclick="window.location.href='Indexi.html'">← Back</span>

  <!-- Title -->
  <h1>App Images</h1>

  <!-- Gallery -->
  <div class="gallery">
    <div class="gallery-item">
      <span onclick="window.location.href='CanvasStudio/Canvas_index.html'">
        <img src="1 canvas Studio main.png" alt="Canvas Studio">
      </span>
      <span class="button-link" onclick="window.location.href='CanvasStudio/Canvas_index.html'">Canvas Studio</span>
    </div>
    <div class="gallery-item">
      <span onclick="window.location.href='ColorPickerStudio/Color_index.html'">
        <img src="1 Color Picker Main.png" alt="Color Picker Studio">
      </span>
      <span class="button-link" onclick="window.location.href='ColorPickerStudio/Color_index.html'">Color Picker Studio</span>
    </div>
    <div class="gallery-item">
      <span onclick="window.location.href='OtherStudio/other_index.html'">
        <img src="OtherStudio/1 other .png" alt="Other Studio">
      </span>
      <span class="button-link" onclick="window.location.href='OtherStudio/other_index.html'">Other Studio</span>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    © 2025 Arttrezzi – All Rights Reserved. |
    <span onclick="window.location.href='Legal.html'">Legal</span> |
    <span onclick="window.location.href='Contact.html'">Contact</span>
  </footer>

</body>
</html>
