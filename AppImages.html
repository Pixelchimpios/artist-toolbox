<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>App Images – Artist Toolbox</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f8a502;
      font-family: 'Segoe UI', sans-serif;
      color: black;
      text-align: center;
    }

    h1 {
      font-size: 3.5em;
      font-weight: bold;
      text-shadow: 2px 2px #a14000;
      margin-top: 70px;
      margin-bottom: 60px;
    }

    .gallery {
      display: flex;
      justify-content: center;
      gap: 50px;
      flex-wrap: wrap;
      margin-bottom: 80px;
    }

    .gallery-item {
      max-width: 300px;
    }

    .gallery-item a {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #0077cc;
      font-weight: bold;
      font-size: 1.3em;
      text-decoration: underline;
    }

    .gallery-item img {
      width: 240px;
      height: 320px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.4);
      margin-bottom: 16px;
      margin-top: 20px;
      transition: transform 0.2s ease-in-out;
    }

    .gallery-item a:hover img {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <h1>App Images</h1>

  <div class="gallery">
    <div class="gallery-item">
       <a href="CanvasStudio/Canvas_index.html">
        <img src="1 canvas Studio main.png" alt="Canvas Studio">
        Canvas Studio
      </a>
    </div>
    <div class="gallery-item">
    <a href="ColorPickerStudio/Color_index.html">
        <img src="1 Color Picker Main.png" alt="Color Picker Studio">
        Color Picker Studio
      </a>
    </div>
    <div class="gallery-item">
      <a href="OtherStudio/other_index.html">
        <img src="OtherStudio/1 other .png" alt="Other Studio">
        Other Studio
      </a>
    </div>
  </div> <!-- end of gallery -->

  <div class="back">
    <a href="Arttrezzi.html" style="font-size: 18px; color: white; text-decoration: none; background: #222; padding: 8px 16px; border-radius: 6px;">← Back to Main</a>
  </div>

</body>
</html>

</body>
</html>
